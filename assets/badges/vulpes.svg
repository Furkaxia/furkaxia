<svg xmlns="http://www.w3.org/2000/svg" width="180" height="36" viewBox="0 0 180 36" fill="none">
  <defs>
    <linearGradient id="vulpesBg" x1="0" y1="0" x2="180" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1c130c" />
      <stop offset="1" stop-color="#2a180b" />
    </linearGradient>
    <linearGradient id="foxGrad" x1="0" y1="0" x2="20" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f97316" />
      <stop offset="1" stop-color="#ea580c" />
    </linearGradient>
  </defs>
  <!-- Background Pill -->
  <rect x="0.5" y="0.5" width="179" height="35" rx="10" fill="url(#vulpesBg)" stroke="#ea580c" stroke-opacity="0.4" />
  
  <!-- Sleek Geometric Fox Emblem -->
  <g transform="translate(14, 8)">
    <!-- Left Ear -->
    <path d="M2 1 L7 9 L1 8 Z" fill="url(#foxGrad)" />
    <!-- Right Ear -->
    <path d="M18 1 L19 8 L13 9 Z" fill="url(#foxGrad)" />
    <!-- Inner Left Ear -->
    <path d="M3.5 3 L6 8 L2.5 7 Z" fill="#ffffff" opacity="0.85" />
    <!-- Inner Right Ear -->
    <path d="M16.5 3 L17.5 7 L14 8 Z" fill="#ffffff" opacity="0.85" />
    <!-- Forehead & Nose Core -->
    <polygon points="7,9 13,9 10,18" fill="url(#foxGrad)" />
    <!-- Left Cheek -->
    <polygon points="1,8 7,9 4,14" fill="#f97316" />
    <polygon points="4,14 7,9 10,18 7,19" fill="#ffffff" />
    <!-- Right Cheek -->
    <polygon points="19,8 16,14 13,9" fill="#f97316" />
    <polygon points="16,14 13,19 10,18 13,9" fill="#ffffff" />
    <!-- Nose Tip -->
    <circle cx="10" cy="18" r="1.3" fill="#18181b" />
    <!-- Sleek Fox Eyes -->
    <path d="M6 10.5 L8.5 11" stroke="#18181b" stroke-width="1.2" stroke-linecap="round" />
    <path d="M14 10.5 L11.5 11" stroke="#18181b" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- Divider -->
  <line x1="43" y1="10" x2="43" y2="26" stroke="#ea580c" stroke-opacity="0.3" stroke-width="1" />

  <!-- Typography -->
  <text x="52" y="22.5" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" font-size="12.5" font-weight="700" letter-spacing="0.2px">thevulpes.dev</text>
</svg>